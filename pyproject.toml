[tool.poetry]
name = "alphadl"
version = "0.1.0"
description = "Lightning AI Project for Cutting-Edge Deep Learning Models in Stock Markets"
authors = ["Igor Lima Rocha <igorlima1740@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = {version = ">=2.1.0", extras = ["cu118"]}
torchvision = {version = ">=0.16.0", extras = ["cu118"]}
lightning = ">=2.5.1,<3.0.0"
hydra-core = ">=1.3.2,<2.0.0"
pyrootutils = "^1.0.4"
rich = "^14.0.0"
pandas = "^2.2.3"
scipy = "^1.15.2"
wandb = "^0.19.9"
openbb = "^4.4.3"
scikit-learn = "^1.6.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[virtualenvs]
in-project = true
path = ".venv"