# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  name: "${logger.wandb.name}" # name of the run
  save_dir: "${paths.output_dir}"
  offline: "${logger.use_wandb:false}" # if use_wandb is false, set offline to true
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: "AlphaDL" # project name
  log_model: true # upload lightning checkpoints
  prefix: "" # a string to put at the beginning of metric keys
  entity: null # set to name of your wandb team
  group: "${logger.wandb.group}" # group runs together
  tags: "${logger.wandb.tags}" # add tags to runs
  job_type: "train" # type of job
