# Override default configurations for a specific experiment

# Data module configuration
data:
  module: sp500_dataset
  class_name: SP500DataModule
  params:
    batch_size: 64
    num_workers: 8
    frequency: 1d
    # Add other dataset-specific parameters here

# Model configuration
model:
  name: stock_mixer
  class_name: StockMixer
  params:
    stocks: 500
    time_steps: 30
    channels: 64
    market: 20
    scale: 1

# Loss function configuration
loss:
  name: stock_loss
  function_name: get_loss
  params:
    alpha: 0.5

# Trainer configurations
trainer:
  max_epochs: 200
  gpus: 1

# Logger configurations
logger:
  wandb:
    name: "stock_mixer_sp500_1d"
    group: "sp500_1d"
    tags: ["sp500", "1d", "stock_mixer"]
